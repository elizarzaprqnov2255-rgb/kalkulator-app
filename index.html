const SWD=new Set(["свър","монт","на","за","и","с","със","до","по","от","в","във","тип","при","бр","броя","броя","че","да","ще","се"]);
const stem=w=>{w=w.replace(/^двойн.*/,"двоен").replace(/^тройн.*/,"троен").replace(/^тела$/,"тяло").replace(/^лампи?$|^лампа$/,"лампа");return w.length<4?w:w.slice(0,4)};
const toks=s=>s.toLowerCase().replace(/(\d),(\d)/g,"$1.$2").replace(/[^a-zа-я0-9.\s]/g," ").replace(/\.(?!\d)/g," ").split(/\s+/).filter(Boolean);
const ISX=CAT.map(d=>({id:d[0],st:new Set(toks(d[2].replace(/\d[\d.,]*|mm²|×/gi," ")).map(stem).filter(x=>x.length>=3&&!SWD.has(x)))}));
function localParse(text){const T=toks(text),pos=[];
for(let i=0;i<T.length;i++){const w=T[i];let v=null,len=1;if(/^\d+(\.\d+)?$/.test(w))v=parseFloat(w);else if(NW[w]!=null){v=NW[w];if(v>=20&&v<100&&T[i+1]==="и"&&NW[T[i+2]]>=1&&NW[T[i+2]]<10){v+=NW[T[i+2]];len=3}}if(v!=null){pos.push({i,len,v});i+=len-1}}
const acc={};pos.forEach((p,k)=>{const end=k+1<pos.length?pos[k+1].i:T.length,win=new Set(T.slice(p.i+p.len,end).map(stem));let best=null,bs=0;for(const it of ISX){let m=0;it.st.forEach(s=>{if(win.has(s))m++});if(!m)continue;const sc=m-.1*(it.st.size-m);if(sc>bs){bs=sc;best=it}}if(best)acc[best.id]=(acc[best.id]||0)+p.v});
return{items:Object.entries(acc).map(([id,q])=>({id:+id,qty:q})),notes:pos.length?"Разпознато без AI (офлайн) – проверете позициите.":"Не открих количества. Кажете например: „5 единични контакта и 3 двойни ключа“."}}
// --- връзка с AI ---
async function askAI(text,files){await AIR;const imgs=files.filter(f=>f.kind!=="text"),extra=files.filter(f=>f.kind==="text").map(f=>"\n\nФАЙЛ "+f.name+":\n"+f.text).join(""),user=(text||"")+extra;
if(AI.sample){if(files.some(f=>f.kind==="pdf"))throw new Error("PDF не се поддържа тук – качете снимка.");const o={cache:false,modelTier:imgs.length?"default":"quick"};if(imgs.length){if(!AI.img)throw new Error("Снимките не се поддържат в този изглед.");o.images=imgs.map(f=>f.blob)}
return await AI.sample.json(RULES+"\n\nКАТАЛОГ:\n"+catText()+"\n\nЗАЯВКА:\n"+(user||"(виж прикачените снимки)"),o)}
const key=ls.g("ekey");if(key){try{const content=[];for(const f of imgs)content.push(f.kind==="pdf"?{type:"document",source:{type:"base64",media_type:"application/pdf",data:await b64(f.blob)}}:{type:"image",source:{type:"base64",media_type:"image/jpeg",data:await b64(f.blob)}});content.push({type:"text",text:user||"(виж прикачените файлове)"});
const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),90000);try{const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",signal:ctl.signal,headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-5-5",max_tokens:2000,system:RULES+"\n\nКАТАЛОГ:\n"+catText(),messages:[{role:"user",content}]})});
if(!r.ok)throw new Error(r.status===401?"Грешен AI ключ (Настройки).":"AI грешка "+r.status);const j=await r.json();return jparse((j.content||[]).map(c=>c.text||"").join(""))}finally{clearTimeout(to)}}
catch(e){if(!(e instanceof TypeError)&&e.name!=="AbortError")throw e;if(imgs.length)throw new Error("Няма връзка с интернет. Снимките и таблиците изискват интернет.")}}
if(imgs.length)throw new Error("За снимки е нужен интернет и AI ключ (Настройки → AI асистент).");
return localParse(user)}
// --- прозорец на асистента ---
const SVGM='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
const SVGC='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.5l-8.5 8.5a5.5 5.5 0 0 1-8-8L13 4.5a3.7 3.7 0 0 1 5.2 5.2L9.7 18.2a1.9 1.9 0 0 1-2.7-2.7l8-8"/></svg>';
let AF=[],SRec=null,dictBound=false;
const $=id=>document.getElementById(id);
function st(m,err){const s=$("ast");if(!s)return;s.textContent=m||"";s.style.color=err?"#b91c1c":""}
function errText(e){const c=e&&e.code;if(c==="not_granted"||c==="sampling_disabled"||c==="capability_disabled")return"Нямате разрешение за AI в тази страница.";if(c==="rate_limited")return"Твърде много заявки. Опитайте след малко.";if(c==="cancelled")return"";if(c==="image_rejected")return"Снимката не е приета. Опитайте друга.";if(c==="invalid_json")return"AI върна неясен отговор. Опитайте пак.";return(e&&e.message)||"Нещо се обърка. Опитайте пак."}
function openAI(){mt.textContent="Асистент";md.classList.add("ctr");
mc.innerHTML=`<p class="sub" style="margin:0 0 8px">Кажете или напишете, напр. „5 единични контакта, 3 двойни ключа“, или качете снимка/таблица.</p><textarea id="at" rows="3" placeholder="Какво ще монтирате?"></textarea><div class="btns" style="margin-top:8px"><button id="amic" type="button">${SVGM}<span>Говори</span></button><button id="afb" type="button">${SVGC}<span>Снимка / файл</span></button></div><input type="file" id="af" hidden multiple accept="image/*,.pdf,.csv,.tsv,.txt,.xlsx"><div id="afl" class="sub"></div><div class="btns" style="margin-top:8px"><button class="p" id="ago" type="button">Анализирай</button></div><div id="ast" class="sub" style="margin-top:6px"></div><div id="ares"></div><p class="sub" style="margin:10px 0 0;font-size:11.5px">При AI анализ данните се изпращат към Claude (Anthropic). Без AI и интернет – опростен разбор само на текст.</p>`;
md.hidden=false;AF=[];
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;$("amic").hidden=!(AI.dict||SR);AIR.then(()=>{const m=$("amic");if(m)m.hidden=!(AI.dict||SR)});
$("amic").onclick=()=>startMic();
$("afb").onclick=()=>$("af").click();
$("af").onchange=async e=>{const fl=[...e.target.files];e.target.value="";for(const f of fl){if(AF.length>=4){st("Най-много 4 файла.",1);break}try{st("Чета "+f.name+"…");AF.push(await prep(f));st("")}catch(x){st(x.message||"Файлът не може да се прочете.",1)}}renderAF()};
$("ago").onclick=async()=>{const text=$("at").value.trim();if(!text&&!AF.length){st("Напишете, кажете или прикачете нещо.",1);return}
$("ago").disabled=true;$("ares").innerHTML="";st("Анализирам…");try{const r=await askAI(text,AF);st("");showRes(r)}catch(e){st(errText(e),1)}finally{const b=$("ago");if(b)b.disabled=false}}}
function renderAF(){const l=$("afl");if(!l)return;l.innerHTML="";AF.forEach((f,i)=>{const s=document.createElement("span");s.textContent=f.name+" ✕ ";s.style.cssText="display:inline-block;margin:4px 6px 0 0;padding:3px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--in);cursor:pointer";s.onclick=()=>{AF.splice(i,1);renderAF()};l.appendChild(s)})}
function startMic(){const ta=$("at"),mic=$("amic");
if(AI.dict){const d=AI.dict;if(!dictBound){dictBound=true;d.onFinal(({text})=>{const t=$("at");if(t)t.value+=t.value?text:text.trimStart()});d.onState(({state})=>{const m=$("amic");if(m)m.classList.toggle("on",state!=="idle")})}
if(d.active()){d.stop();return}d.start({language:"bg"}).catch(e=>e&&e.code==="unavailable"?d.start():Promise.reject(e)).catch(e=>st(e&&e.code==="not_granted"?"Няма достъп до микрофона.":"Гласовото въвеждане не стартира. Пишете текста.",1));return}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){st("Гласово въвеждане не се поддържа тук. Ползвайте микрофона на клавиатурата.",1);return}
if(SRec){SRec.stop();return}SRec=new SR();SRec.lang="bg-BG";SRec.interimResults=true;SRec.continuous=true;const base=ta.value?ta.value+" ":"";
SRec.onresult=e=>{let s="";for(let i=0;i<e.results.length;i++)s+=e.results[i][0].transcript;ta.value=base+s};
SRec.onend=()=>{SRec=null;const m=$("amic");if(m)m.classList.remove("on")};
SRec.onerror=e=>st(e.error==="not-allowed"?"Няма достъп до микрофона.":"Гласовото разпознаване иска интернет. Пишете или ползвайте микрофона на клавиатурата.",1);
try{SRec.start();mic.classList.add("on")}catch(x){SRec=null}}
function showRes(r){const m={};((r&&r.items)||[]).forEach(o=>{const id=+o.id,q=parseFloat(String(o.qty).replace(",","."));if(CAT.some(d=>d[0]===id)&&q>0)m[id]=(m[id]||0)+q});const ids=Object.keys(m).map(Number),box=$("ares");if(!box)return;box.innerHTML="";
const note=document.createElement("div");note.className="sub";note.style.marginTop="8px";note.textContent=(r&&r.notes)||"";
if(!ids.length){const t=document.createElement("div");t.className="sub";t.style.marginTop="8px";t.textContent="Не намерих подходящи позиции.";box.append(t,note);return}
const h=document.createElement("div");h.className="sub";h.style.marginTop="10px";h.innerHTML="<b>Намерено – проверете и коригирайте:</b>";box.appendChild(h);
ids.forEach(id=>{const d=D[id-1],row=document.createElement("div");row.className="sr";row.dataset.id=id;const sp=document.createElement("span");sp.textContent=d[2]+" ";const sm=document.createElement("small");sm.textContent="/ "+d[3];sp.appendChild(sm);const inp=document.createElement("input");inp.type="text";inp.inputMode="decimal";inp.value=String(Math.round(m[id]*100)/100).replace(".",",");const x=document.createElement("button");x.type="button";x.textContent="✕";x.style.cssText="border:0;background:none;color:var(--tx);font-size:18px";x.onclick=()=>row.remove();row.append(sp,inp,x);box.appendChild(row)});
box.appendChild(note);const ok=document.createElement("button");ok.type="button";ok.className="p";ok.textContent="Добави към сметката";ok.style.cssText="width:100%;margin-top:10px;padding:12px;border-radius:10px;border:1px solid var(--ac);background:var(--ac);color:var(--ac2);font:inherit;font-weight:600";
ok.onclick=()=>{const L=[...box.querySelectorAll(".sr")].map(r=>({id:+r.dataset.id,q:pf(r.querySelector("input").value)})).filter(o=>o.q>0);if(!L.length)return;let first=null;
L.forEach(({id,q})=>{const r=document.querySelector('.row[data-n="'+id+'"]');if(!r)return;setQ(r,Math.round(((qty[id]||0)+q)*100)/100);const dt=r.closest("details");if(dt)dt.open=true;if(!first)first=r});closeM();if(first)first.scrollIntoView({block:"center"})};
box.appendChild(ok)}
$("ab").onclick=openAI;

upd();
